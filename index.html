<!doctype html>
<html lang="en" data-theme="system" data-resolved-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gridline — US Data Center Infrastructure &amp; Telemetry Atlas</title>
    <meta
      name="description"
      content="Cartographic intelligence atlas tracking US hyperscale data center power load, water consumption, cooling architecture, permitting, and live NOAA/USGS/FERC telemetry."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23090d14'/%3E%3Cpath d='M7 16h4l3-7 4 14 3-7h4' fill='none' stroke='%2310b981' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get("theme");
          var stored = window.localStorage.getItem("gridline:theme");
          var mode =
            urlTheme === "light" || urlTheme === "dark" || urlTheme === "system"
              ? urlTheme
              : stored === "light" || stored === "dark" || stored === "system"
                ? stored
                : "system";
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            mode === "system" ? (prefersDark ? "dark" : "light") : mode;
          document.documentElement.setAttribute("data-theme", mode);
          document.documentElement.setAttribute("data-resolved-theme", resolved);
        } catch (_err) {
          document.documentElement.setAttribute("data-theme", "system");
          document.documentElement.setAttribute("data-resolved-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
