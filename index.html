<!doctype html>
<html lang="en" data-theme="system" data-resolved-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undercurrent — the power and water behind US data centers</title>
    <meta
      name="description"
      content="A live atlas of US data centers: verified and reported power capacity, water use, cooling, permits, and current grid, weather and river conditions, each figure labeled with its source."
    />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-width='2.6' stroke-linecap='round'%3E%3Crect width='24' height='24' rx='5' fill='%2305080c'/%3E%3Cpath d='M4 10c2.4-4 4.8-4 8 0s5.600 4 8 0' stroke='%23ffb020'/%3E%3Cpath d='M4 15c2.400 4 4.800 4 8 0s5.600-4 8 0' stroke='%2338c8ff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <script>
      // Resolve the theme before first paint. Default follows the OS setting.
      (function () {
        var mode = "system";
        try {
          var urlTheme = new URLSearchParams(window.location.search).get("theme");
          var stored = window.localStorage.getItem("undercurrent:theme");
          var valid = { light: 1, dark: 1, system: 1 };
          mode = valid[urlTheme] ? urlTheme : valid[stored] ? stored : "system";
        } catch (_err) {}
        var prefersDark =
          !window.matchMedia ||
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var resolved = mode === "system" ? (prefersDark ? "dark" : "light") : mode;
        document.documentElement.setAttribute("data-theme", mode);
        document.documentElement.setAttribute("data-resolved-theme", resolved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
